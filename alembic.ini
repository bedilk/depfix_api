# Alembic config for depfix.
#
# ``sqlalchemy.url`` is intentionally left blank -- ``migrations/env.py``
# always pulls the real URL from ``depfix.config.get_settings().database_url``
# at run time (the same source ``storage/db.get_engine()`` uses), so this
# file never drifts out of sync with whatever DATABASE_URL/.env says. This
# file exists purely for the *developer* CLI workflow (``alembic revision
# --autogenerate``, ``alembic upgrade head`` run by hand from the repo
# root); the fleet orchestrator's own ``init_schema()`` builds an
# in-memory ``Config`` and never reads this file at all (see
# ``storage/db.py``), which is what lets Postgres migrations run inside the
# Docker image even though only ``src/`` -- not this file -- is copied in.
[alembic]
script_location = src/depfix/migrations
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
