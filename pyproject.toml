[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================================
#  depfix — AI-powered dependency migration agent
# ============================================================================

[project]
name = "depfix"
version = "0.2.0"
description = "AI-powered automatic fixing of breaking dependency changes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "depfix authors" },
]
keywords = ["ai", "llm", "dependencies", "migration", "codemod"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

# Runtime dependencies. Keep in sync with requirements.txt.
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "PyYAML>=6.0",
    "PyJWT[crypto]>=2.8.0",
    "sentry-sdk>=2.0.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-requests",
    "types-PyYAML",
    "pre-commit>=3.7.0",
    "bandit[toml]>=1.7.0",
    "respx>=0.21.0",
]

[project.scripts]
depfix = "depfix.cli:main"

[project.urls]
Homepage = "https://github.com/bedilk/dependency_check"
Issues   = "https://github.com/bedilk/dependency_check/issues"

# ============================================================================
#  Setuptools: src-layout package discovery
# ============================================================================

[tool.setuptools.packages.find]
where = ["src"]
include = ["depfix*"]

[tool.setuptools.package-data]
depfix = [
    "py.typed",
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
    "catalog/*.yaml",
]

# ============================================================================
#  Ruff: lint + format (replaces flake8 + black + isort)
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [
    ".venv", "venv", "build", "dist",
    "tests/fixtures",
    "output",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "SIM",           # flake8-simplify
    "C4",            # comprehensions
    "TID",           # tidy-imports
    "RUF",           # ruff-native
]
ignore = ["E501"]    # line-length is enforced by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "SIM117"]

[tool.ruff.format]
quote-style = "double"

# ============================================================================
#  mypy: static typing
# ============================================================================

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true    # third-party LLM SDK stubs are patchy
exclude = ["tests/fixtures/", "build/", "dist/"]

# ============================================================================
#  pytest
# ============================================================================

[tool.bandit]
# B101: asserts are used for internal invariants (e.g. "engine was already
#   initialized"), never for validating untrusted input.
# B404/B603: subprocess is used exactly once, to shell out to a full-path-
#   resolved `node` binary with a static argv list, to syntax-check generated
#   JS/TS — not attacker-controlled input, shell=False throughout.
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: hits real external services (LLM API). Slow and costs $.",
    "e2e: end-to-end test running the full pipeline.",
]
pythonpath = ["src"]

# ============================================================================
#  coverage
# ============================================================================

[tool.coverage.run]
source = ["src/depfix"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
