- id: anthropic
  name: Anthropic
  api_version_scheme: semver
  api_base_urls:
  - https://api.anthropic.com
  sdk_packages:
  - name: '@anthropic-ai/sdk'
    ecosystem: npm
  - name: anthropic
    ecosystem: pypi
  - name: anthropic
    ecosystem: rubygems
  feeds:
  - kind: npm_dist_tag
    package: '@anthropic-ai/sdk'
    dist_tag: latest
    github_repo: anthropics/anthropic-sdk-typescript
  - kind: pypi_dist_tag
    package: anthropic
    github_repo: anthropics/anthropic-sdk-python
  - kind: github_release
    repo: anthropics/anthropic-sdk-typescript
  - kind: security_advisory
    package: '@anthropic-ai/sdk'
    ecosystem: npm
  - kind: security_advisory
    package: anthropic
    ecosystem: pypi
  - kind: rubygems_dist_tag
    gem: anthropic
  - kind: openapi_spec
    url: https://raw.githubusercontent.com/anthropics/anthropic-sdk-python/main/api.json
  - kind: changelog_html
    url: https://docs.anthropic.com/en/release-notes/api
  - kind: ts_exports_diff
    package: '@anthropic-ai/sdk'
  # Fixture: messages.stream() introduced in @anthropic-ai/sdk 0.37 as the
  # preferred streaming helper. messages.create() still works for non-streaming,
  # but streaming callers should migrate.
  - kind: fixture_change
    id: anthropic-sdk-stream-api-0.20-0.131
    old_token: "0.20.9"
    new_token: "0.131.0"
    spec_changes:
      - kind: operation_id_changed
        severity: breaking
        subject: "anthropic.messages.create"
        after: "anthropic.messages.stream"
        detail: >
          Replace streaming calls: const stream = client.messages.stream({model,
          max_tokens, messages}); const msg = await stream.finalMessage();
          For non-streaming, messages.create() is unchanged.
          messages.stream() returns a MessageStream — call .finalMessage() to get
          the completed Message, or iterate with for-await for incremental events.
