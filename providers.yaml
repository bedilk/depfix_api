  # Fixture: node-postgres 8.23 explicit connection management.
  # Pool.query() is a convenience wrapper; in 8.23+ explicit connect/release
  # is required for transaction support and connection error handling.
  - kind: fixture_change
    id: pg-8-pool-query-to-connect-8.16-8.23
    old_token: "8.16.3"
    new_token: "8.23.1"
    spec_changes:
      - kind: operation_id_changed
        severity: breaking
        subject: "postgresql.Pool"
        after: "pg.Pool"
        detail: >
          In pg ≥8.23, prefer named imports: import { Pool } from 'pg'
          instead of the default import pattern. Also use explicit
          pool.connect() + client.release() for transaction safety.
      - kind: operation_id_changed
        severity: breaking
        subject: "postgresql.query"
        after: "postgresql.execute"
        detail: >
          In pg ≥8.23, pool.execute() (aliased from query) provides
          clearer intent for parameterised statements with typed results.
