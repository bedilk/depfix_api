- id: spec-request-enum-value-removed
  category: spec_diff
  verified: true
  description: >
    Removing an accepted enum value from a request field maps to
    ENUM_VALUE_REMOVED with severity=breaking (request direction).
  package: widgetapi
  old_version: "1.0.0"
  new_version: "2.0.0"
  old_spec:
    openapi: "3.0.0"
    info: {title: WidgetAPI, version: "1.0.0"}
    paths:
      /v1/charges:
        post:
          operationId: createCharge
          requestBody:
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    currency: {type: string, enum: [usd, eur, gbp]}
          responses:
            "200":
              description: ok
  new_spec:
    openapi: "3.0.0"
    info: {title: WidgetAPI, version: "2.0.0"}
    paths:
      /v1/charges:
        post:
          operationId: createCharge
          requestBody:
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    currency: {type: string, enum: [usd, eur]}
          responses:
            "200":
              description: ok
  expected_changes:
    - kind: enum_value_removed
      old_api_contains: gbp
      min_confidence: 1.0
